<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinchan × Kazama — Birthday Website</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            overflow: hidden;
            animation: slideIn 0.6s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 50px 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.8em;
            margin-bottom: 15px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
            letter-spacing: 2px;
        }
        
        .header p {
            font-size: 1.3em;
            opacity: 0.95;
            font-weight: 300;
            letter-spacing: 1px;
        }
        
        .divider {
            height: 3px;
            background: rgba(255, 255, 255, 0.3);
            margin-top: 20px;
        }
        
        .gallery {
            padding: 40px 25px;
        }
        
        .gallery-title {
            text-align: center;
            color: #333;
            font-size: 1.3em;
            margin-bottom: 30px;
            font-weight: 600;
        }
        
        .gallery-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
        }
        
        .photo-item {
            text-align: center;
            animation: fadeIn 0.6s ease-out forwards;
            opacity: 0;
        }
        
        .photo-item:nth-child(1) { animation-delay: 0.1s; }
        .photo-item:nth-child(2) { animation-delay: 0.2s; }
        .photo-item:nth-child(3) { animation-delay: 0.3s; }
        .photo-item:nth-child(4) { animation-delay: 0.4s; }
        .photo-item:nth-child(5) { animation-delay: 0.5s; }
        .photo-item:nth-child(6) { animation-delay: 0.6s; }
        .photo-item:nth-child(7) { animation-delay: 0.7s; }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .photo-wrapper {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }
        
        .photo-item img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        
        .photo-wrapper:hover img {
            transform: scale(1.08);
        }
        
        .photo-number {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(102, 126, 234, 0.9);
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9em;
        }
        
        .footer {
            background: linear-gradient(135deg, #f5f7fa 0%, #f0f2f5 100%);
            padding: 30px 25px;
            text-align: center;
            border-top: 1px solid #e0e0e0;
        }
        
        .footer p {
            color: #666;
            font-size: 1em;
            font-weight: 500;
            margin-bottom: 10px;
        }
        
        .footer .heart {
            color: #e74c3c;
            animation: heartbeat 1.2s infinite;
        }
        
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        
        /* Mobile Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }
            
            .header p {
                font-size: 1.1em;
            }
            
            .gallery {
                padding: 25px 15px;
            }
            
            .gallery-grid {
                gap: 18px;
            }
            
            body {
                padding: 10px;
            }
            
            .container {
                border-radius: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎂 Birthday Special 🎂</h1>
            <p>Sinchan × Kazama</p>
            <div class="divider"></div>
        </div>
        
        <div class="gallery">
            <div class="gallery-title">✨ Photo Gallery ✨</div>
            <div class="gallery-grid">
                <div class="photo-item">
                    <div class="photo-wrapper">
                        <img src="photos/photo1.jpg" alt="Birthday Photo 1">
                        <div class="photo-number">1</div>
                    </div>
                </div>
                
                <div class="photo-item">
                    <div class="photo-wrapper">
                        <img src="photos/photo2.jpg" alt="Birthday Photo 2">
                        <div class="photo-number">2</div>
                    </div>
                </div>
                
                <div class="photo-item">
                    <div class="photo-wrapper">
                        <img src="photos/photo3.jpg" alt="Birthday Photo 3">
                        <div class="photo-number">3</div>
                    </div>
                </div>
                
                <div class="photo-item">
                    <div class="photo-wrapper">
                        <img src="photos/photo4.jpg" alt="Birthday Photo 4">
                        <div class="photo-number">4</div>
                    </div>
                </div>
                
                <div class="photo-item">
                    <div class="photo-wrapper">
                        <img src="photos/photo5.jpg" alt="Birthday Photo 5">
                        <div class="photo-number">5</div>
                    </div>
                </div>
                
                <div class="photo-item">
                    <div class="photo-wrapper">
                        <img src="photos/photo6.jpg" alt="Birthday Photo 6">
                        <div class="photo-number">6</div>
                    </div>
                </div>
                
                <div class="photo-item">
                    <div class="photo-wrapper">
                        <img src="photos/photo7.jpg" alt="Birthday Photo 7">
                        <div class="photo-number">7</div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <p><span class="heart">♥</span> Made with Love <span class="heart">♥</span></p>
            <p>Happy Birthday! 🎉</p>
        </div>
    </div>
</body>
</html>
